<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe6" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16140f" />
  <meta name="description" content="Estadísticas de escucha compartidas desde Frecuencia." />

  <title>Estadísticas compartidas en Frecuencia</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/css/styles.css" />

<body>
  <a class="skip-link" id="skip-link" href="#">Saltar al contenido</a>

  <footer class="site-footer">
    <nav aria-label="Información legal">
      <ul>
        <li><a href="/privacidad">Privacidad</a></li>

  </footer>

  <script type="module" src="/js/a11y.js"></script>
  <script type="module" src="/js/share.js"></script>
