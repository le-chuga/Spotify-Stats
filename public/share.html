<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frecuencia · Estadísticas compartidas</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .share-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .share-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--line);
      background: #2a2d33;
      display: block;
      margin: 0 auto 12px;
    }
    .share-avatar-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #2a2d33;
      border: 2px solid var(--line);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .share-name {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .share-meta {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .share-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .share-loading {
      text-align: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-top: 60px;
    }
    .share-error {
      text-align: center;
      color: var(--accent-2);
      font-size: 1rem;
      margin-top: 60px;
    }
    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .share-block--wide { grid-column: 1 / -1; }
    @media (max-width: 720px) {
      .share-grid { grid-template-columns: 1fr; }
    }
  </style>
  <style>
    /* Permitir scroll en la página de snapshot */
    html, body { overflow-y: auto !important; height: auto !important; }
  </style>
</head>
<body>
  <div class="eq-background" aria-hidden="true">
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    <div class="eq-bar"></div><div class="eq-bar"></div>
  </div>

  <div id="app" style="position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:48px 24px;">
    <p class="share-loading" id="loading-msg">Cargando estadísticas…</p>
  </div>

  <script>
    const id = location.pathname.split("/share/")[1];

    async function load() {
      const res = await fetch(`/api/share/${id}`);
      const json = await res.json();

      const app = document.getElementById("app");

      if (!json.success) {
        app.innerHTML = `<p class="share-error">Este enlace no existe o ha caducado.</p>`;
        return;
      }

      const { stats, avatarBase64, createdAt } = json.snapshot;

      const date = new Date(createdAt).toLocaleDateString("es-ES", {
        day: "numeric", month: "long", year: "numeric"
      });

      app.innerHTML = `
        <div class="share-header">
          ${avatarBase64
            ? `<img class="share-avatar" src="${avatarBase64}" alt="" />`
            : `<div class="share-avatar-placeholder"><svg viewBox="0 0 56 56" width="32" height="32" fill="none"><line x1="28" y1="16" x2="28" y2="40" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/><line x1="16" y1="28" x2="40" y2="28" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/></svg></div>`
          }
          <h1 class="share-name">${stats.profile?.displayName || "Usuario"}</h1>
          <p class="share-meta">${stats.profile?.followers ?? 0} seguidores</p>
          <p class="share-badge">Estadísticas · ${date}</p>
        </div>

        <div class="share-grid">
          <article class="stats-block">
            <h3 class="stats-block-title">Canciones más escuchadas</h3>
            <ol class="stats-list">${renderTracks(stats.topTracks)}</ol>
          </article>
          <article class="stats-block">
            <h3 class="stats-block-title">Artistas favoritos</h3>
            <ol class="stats-list">${renderArtists(stats.topArtists)}</ol>
          </article>
          <article class="stats-block share-block--wide">
            <h3 class="stats-block-title">Reproducido recientemente</h3>
            <ol class="stats-list">${renderRecent(stats.recentlyPlayed)}</ol>
          </article>
        </div>
      `;
    }

    function item(imageUrl, title, subtitle) {
      return `<li>
        ${imageUrl ? `<img src="${imageUrl}" alt="" />` : ""}
        <div class="item-text">
          <p class="item-title">${title}</p>
          <p class="item-subtitle">${subtitle}</p>
        </div>
      </li>`;
    }

    function renderTracks(tracks = []) {
      if (!tracks.length) return `<li class="stats-empty">Sin datos</li>`;
      return tracks.map(t => item(t.imageUrl, t.name, t.artist)).join("");
    }

    function renderArtists(artists = []) {
      if (!artists.length) return `<li class="stats-empty">Sin datos</li>`;
      return artists.map(a => item(a.imageUrl, a.name, a.genres?.slice(0,2).join(", ") || "Sin géneros")).join("");
    }

    function renderRecent(recent = []) {
      if (!recent.length) return `<li class="stats-empty">Sin datos</li>`;
      return recent.map(r => item(r.imageUrl, r.name,
        `${r.artist} · ${new Date(r.playedAt).toLocaleString("es-ES")}`
      )).join("");
    }

    load();
  </script>
</body>
</html>
